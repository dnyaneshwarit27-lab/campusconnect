services:
  - type: web
    name: campusconnect
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn campusconnect.wsgi:application --bind 0.0.0.0:$PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        value: campusconnect
